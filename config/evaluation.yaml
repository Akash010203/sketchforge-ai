# Predefined layout constraints used by the evaluator and the repair engine.
# All distances are design-space pixels (the page is typically 1024 px wide).
# Definitions and limitations: docs/EVALUATION.md
constraints:
  containment_tolerance_px: 2.0    # child may poke out of its parent by this much without an issue
  overlap_tolerance_ratio: 0.05    # sibling overlap (intersection / smaller area) allowed
  align_snap_radius_px: 16.0       # edges closer than this are considered "meant to be aligned"
  align_tolerance_px: 2.0          # ...and must then agree within this tolerance
  spacing_tolerance_px: 4.0        # gaps inside a repeated group must agree within this
  min_touch_size_px: 24.0          # buttons / inputs must be at least this tall
  min_control_size_px: 16.0        # checkboxes / radios must be at least this wide and tall
  min_contrast_ratio: 4.5          # WCAG 2.x AA for normal text
  text_overflow_tolerance_px: 1.0  # estimated text may exceed its box by this much
  min_font_size_px: 10.0
  page_margin_tolerance_px: 1.0

regression:
  max_fidelity_iou_drop: 0.02      # mean IoU against the sketch detections may not fall more than this
  max_position_error_increase_px: 2.0
  min_target_improvement: 0.01     # the targeted metric must improve by at least this (absolute)

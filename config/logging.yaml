version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: "%(asctime)s %(levelname)-7s %(name)s: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    level: INFO
root:
  level: INFO
  handlers: [console]
loggers:
  sketchforge:
    level: INFO
